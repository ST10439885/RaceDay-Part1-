name: RaceDay CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Checking RaceDay project files..."

          test -f README.md || (echo "ERROR: README.md is missing" && exit 1)
          test -f "RaceDay_ERD.png" || (echo "ERROR: RaceDay_ERD.png is missing" && exit 1)
          test -f "API_Endpoint_Plan (1).pdf" || (echo "ERROR: API_Endpoint_Plan (1).pdf is missing" && exit 1)
          test -f "SQL Part one.sql" || (echo "ERROR: SQL Part one.sql is missing" && exit 1)

          echo "All required RaceDay files are present."
          echo "CI/CD validation successful!"

      - name: Display repository contents
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort
